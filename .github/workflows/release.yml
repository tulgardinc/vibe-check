name: Release

on:
  push:
    branches: [release]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: darwin-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: darwin-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/vibec dist/vibec-${{ matrix.suffix }}
          cp target/${{ matrix.target }}/release/vibecheck-mcp dist/vibecheck-mcp-${{ matrix.suffix }}

      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy target\${{ matrix.target }}\release\vibec.exe dist\vibec-${{ matrix.suffix }}.exe
          copy target\${{ matrix.target }}\release\vibecheck-mcp.exe dist\vibecheck-mcp-${{ matrix.suffix }}.exe

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.suffix }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          SHA=$(git rev-parse --short HEAD)
          echo "tag=v${VERSION}-${SHA}" >> $GITHUB_OUTPUT

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x dist/vibec-* dist/vibecheck-mcp-* 2>/dev/null || true
          gh release create ${{ steps.version.outputs.tag }} dist/* \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "Automated release from commit $(git rev-parse --short HEAD)" \
            --latest
