[package]
name = "vibecheck"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "vibec"
path = "src/main.rs"

[[bin]]
name = "vibecheck-mcp"
path = "src/mcp.rs"

[dependencies]
tree-sitter = "0.24"
tree-sitter-typescript = "0.23"
rusqlite = { version = "0.33", features = ["bundled", "blob"] }
sqlite-vec = "0.1.6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rayon = "1.10"
walkdir = "2"
ignore = "0.4"
regex = "1"
chrono = "0.4"
thiserror = "2"
hex = "0.4"
indicatif = "0.17"
tree-sitter-javascript = "0.23"
tree-sitter-rust = "0.23"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
